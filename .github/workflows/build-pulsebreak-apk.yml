name: Build Fixed PULSEBREAK APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7"
  PROJECT_PATH: godot-game
  EXPORT_NAME: PULSEBREAK-fixed

jobs:
  android:
    name: Validate runtime and export fixed APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and patch Godot project
        shell: bash
        run: |
          mkdir -p pulsebreak-ci
          exec > >(tee pulsebreak-ci/setup.log) 2>&1
          set -euo pipefail
          base64 --decode pulsebreak-ci/pulsebreak_project.tar.gz.b64 > /tmp/pulsebreak_project.tar.gz
          tar -xzf /tmp/pulsebreak_project.tar.gz
          test -f "$PROJECT_PATH/project.godot"

          cat > /tmp/upgrades_block.gd <<'EOF'
          var upgrades: Array[Dictionary] = []

          func make_upgrade(id: String, title: String, description: String, tint: Color) -> Dictionary:
          	return {"id": id, "title": title, "desc": description, "color": tint}

          func setup_upgrades() -> void:
          	upgrades.clear()
          	upgrades.append(make_upgrade("damage", "NÚCLEO OFENSIVO", "+24% de dano dos projéteis", RED))
          	upgrades.append(make_upgrade("firerate", "CADÊNCIA VETORIAL", "Dispara 17% mais rápido", CYAN))
          	upgrades.append(make_upgrade("speed", "IMPULSO CINÉTICO", "+12% de velocidade", GREEN))
          	upgrades.append(make_upgrade("maxhp", "BLINDAGEM VIVA", "+25 de vida máxima e cura 25", ORANGE))
          	upgrades.append(make_upgrade("multishot", "FEIXE DUPLO", "Adiciona um projétil lateral", PURPLE))
          	upgrades.append(make_upgrade("pierce", "MUNIÇÃO FÁSICA", "Projéteis atravessam +1 alvo", YELLOW))
          	upgrades.append(make_upgrade("pulse", "RESSONÂNCIA", "Pulso maior, forte e mais frequente", CYAN_SOFT))
          	upgrades.append(make_upgrade("dash", "RUPTURA", "Dash recarrega mais rápido", WHITE))
          	upgrades.append(make_upgrade("magnet", "CAMPO COLETOR", "+45 de alcance para coletar XP", GREEN))
          	upgrades.append(make_upgrade("armor", "MALHA REATIVA", "-10% de dano recebido", MUTED))
          	upgrades.append(make_upgrade("regen", "RECUPERAÇÃO", "Regenera 1,2 de vida por segundo", GREEN))
          EOF
          sed -i 's/^          //' /tmp/upgrades_block.gd

          awk '
            /^var upgrades := \[$/ {
              while ((getline line < "/tmp/upgrades_block.gd") > 0) print line
              close("/tmp/upgrades_block.gd")
              skip = 1
              next
            }
            skip && /^\]$/ { skip = 0; next }
            !skip { print }
          ' "$PROJECT_PATH/main.gd" > "$PROJECT_PATH/main.gd.fixed"
          mv "$PROJECT_PATH/main.gd.fixed" "$PROJECT_PATH/main.gd"
          sed -i '/^[[:space:]]*rng.randomize()$/a\	setup_upgrades()' "$PROJECT_PATH/main.gd"
          bash pulsebreak-ci/apply_type_fixes.sh
          grep -q '^var upgrades: Array\[Dictionary\] = \[\]$' "$PROJECT_PATH/main.gd"
          grep -q $'^\tsetup_upgrades()$' "$PROJECT_PATH/main.gd"

      - name: Configure Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot "$HOME/.config/godot"
          fi
          godot --version

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_PATH"
          godot --headless --editor --path . --quit-after 3 2>&1 | tee ../pulsebreak-ci/import.log

      - name: Run main scene probe
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_PATH"
          godot --headless --path . --script ../pulsebreak-ci/runtime_probe.gd 2>&1 | tee ../pulsebreak-ci/runtime.log
          grep -q "PULSEBREAK_PROBE_OK" ../pulsebreak-ci/runtime.log
          if grep -E "SCRIPT ERROR|ERROR: Failed to load script" ../pulsebreak-ci/runtime.log; then
            exit 1
          fi

      - name: Export fixed Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          EXPORT_DIR="$(readlink -f build/android)"
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-debug "Android" "$EXPORT_DIR/${EXPORT_NAME}.apk" 2>&1 | tee ../pulsebreak-ci/export.log
          test -s "$EXPORT_DIR/${EXPORT_NAME}.apk"
          sha256sum "$EXPORT_DIR/${EXPORT_NAME}.apk" | tee "$EXPORT_DIR/${EXPORT_NAME}.apk.sha256"
          unzip -t "$EXPORT_DIR/${EXPORT_NAME}.apk" | tee ../pulsebreak-ci/apk-integrity.log

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: PULSEBREAK-fixed-Android-APK
          path: build/android/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PULSEBREAK-fixed-diagnostics
          path: |
            pulsebreak-ci/setup.log
            pulsebreak-ci/import.log
            pulsebreak-ci/runtime.log
            pulsebreak-ci/export.log
            pulsebreak-ci/apk-integrity.log
          if-no-files-found: warn
          retention-days: 7
